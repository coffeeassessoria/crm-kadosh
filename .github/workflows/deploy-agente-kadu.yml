name: Deploy Agente Kadu → VPS

on:
  push:
    branches: [master]
    paths:
      - 'agente-kadu/**'
  workflow_dispatch:  # permite disparar manualmente pela aba Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 76.13.164.112
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/kadosh-crm && git pull --ff-only && cd agente-kadu && docker compose up -d --build
